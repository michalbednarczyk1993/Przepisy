name: Verify Flutter scaffold

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "${RUNNER_TEMP}/flutter"
          echo "${RUNNER_TEMP}/flutter/bin" >> "${GITHUB_PATH}"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          flutter --version
          dart --version
          flutter --version | head -n 1 | grep -F "Flutter 3.47.2"
          dart --version 2>&1 | grep -F "Dart SDK version: 3.13.2"

      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff --exit-code -- analysis_options.yaml pubspec.lock

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web

      - name: Build Android debug
        run: flutter build apk --debug
